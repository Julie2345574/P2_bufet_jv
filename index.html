<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Bufet - objednávka</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        input[type="number"] {
            width: 60px;
        }

        .form-section {
            margin-top: 30px;
        }

        .form-section input {
            display: block;
            margin-bottom: 10px;
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            background-color: gray;
        }
    </style>
</head>
<body>

<h1>Bufet - objednávka</h1>

<table>
    <thead>
        <tr>
            <th>Položka</th>
            <th>Cena (Kč)</th>
            <th>Počet</th>
        </tr>
    </thead>
    <tbody id="menu">
        <!-- Ukázkové položky (můžeš je nahradit CSV napojením) -->
        <tr>
            <td>Bageta</td>
            <td class="price">50</td>
            <td><input type="number" min="0" value="0"></td>
        </tr>
        <tr>
            <td>Sendvič</td>
            <td class="price">40</td>
            <td><input type="number" min="0" value="0"></td>
        </tr>
        <tr>
            <td>Limonáda</td>
            <td class="price">25</td>
            <td><input type="number" min="0" value="0"></td>
        </tr>
    </tbody>
</table>

<!-- ===============================
     NOVÁ VSTUPNÍ POLE (FORMULÁŘ)
     =============================== -->
<div class="form-section">
    <h3>Kontaktní údaje</h3>

    <!-- Povinné pole: JMÉNO -->
    <input
        type="text"
        id="name"
        placeholder="Příjmení Jméno (např. Novák Jan)"
        required
    >

    <!-- Povinné pole: TELEFON -->
    <input
        type="tel"
        id="phone"
        placeholder="+420 000 000 000"
        required
    >

    <!-- Tlačítko odeslání -->
    <button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>
</div>


<script>
/* =========================================
   FUNKCE PRO ODESLÁNÍ OBJEDNÁVKY EMAILEM
   ========================================= */
function odeslatObjednavku() {

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();

    // ===== VALIDACE FORMULÁŘE =====
    if (!name || !phone) {
        alert("Vyplňte prosím jméno i telefon.");
        return;
    }

    const rows = document.querySelectorAll("#menu tr");

    let celkemCena = 0;
    let celkemKusu = 0;
    let textObjednavky = "";

    rows.forEach(row => {
        const nazev = row.cells[0].innerText;
        const cena = parseFloat(row.cells[1].innerText);
        const kusy = parseInt(row.cells[2].querySelector("input").value);

        if (kusy > 0) {
            const soucet = cena * kusy;
            celkemCena += soucet;
            celkemKusu += kusy;

            textObjednavky += `${nazev} - ${kusy} ks - ${cena} Kč/ks = ${soucet} Kč\n`;
        }
    });

    if (celkemKusu === 0) {
        alert("Nevybrali jste žádné položky.");
        return;
    }

    textObjednavky += `\nCelkem kusů: ${celkemKusu}`;
    textObjednavky += `\nCelková cena: ${celkemCena} Kč`;

    // =========================================
    // MAILTO FUNKCE – OTEVŘE EMAILOVÉHO KLIENTA
    // =========================================
    const email = "vankova.julie@kostka-skola.cz";
    const predmet = "Objednávka z bufetu";
    const zprava =
        `Objednávka od: ${name}\n` +
        `Telefon: ${phone}\n\n` +
        `Položky:\n${textObjednavky}`;

    // vytvoření mailto odkazu
    const mailtoLink = `mailto:${email}?subject=${encodeURIComponent(predmet)}&body=${encodeURIComponent(zprava)}`;

    // otevření emailového klienta
    window.location.href = mailtoLink;
}
</script>

</body>
</html>
