<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Objednávka školního bufetu</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}

h1 {
    text-align: center;
    background: #2a72d4;
    color: white;
    padding: 20px;
}

.container {
    width: 90%;
    max-width: 500px;
    margin: 30px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}

.item {
    display: flex;
    justify-content: space-between;
    margin: 12px 0;
    font-size: 18px;
}

input[type="number"] {
    width: 70px;
    text-align: center;
}

input[type="text"],
input[type="tel"] {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    font-size: 16px;
}

#celkem, #pocet {
    text-align: center;
    font-size: 22px;
    margin-top: 15px;
    font-weight: bold;
    color: #2a72d4;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    font-size: 22px;
    background: #ff6b35;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #e85a28;
}
</style>
</head>

<body>

<h1>SŠ Kostka – OBJEDNÁVKY BUFET</h1>

<div class="container">

    <div id="items"></div>

    <div id="celkem">Celková cena: 0 Kč</div>
    <div id="pocet">Počet kusů: 0</div>

    <!-- ===============================
         NOVÁ VSTUPNÍ POLE (FORMULÁŘ)
         =============================== -->
    <h3>Kontaktní údaje</h3>

    <input
        type="text"
        id="name"
        placeholder="Příjmení Jméno (např. Novák Jan)"
        required
    >

    <input
        type="tel"
        id="phone"
        placeholder="+420 000 000 000"
        required
    >

    <button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>

</div>

<script>

let items = [];

/* =========================================
   NAČTENÍ CSV SOUBORU
   ========================================= */
async function loadCSV() {
    try {
        const response = await fetch("data_bufet.csv?t=" + Date.now());
        if (!response.ok) {
            throw new Error("Soubor nebyl nalezen");
        }

        const text = await response.text();
        parseCSV(text);
        renderItems();

    } catch (err) {
        console.error(err);
        alert("Chyba načítání CSV.");
    }
}

/* =========================================
   PARSOVÁNÍ CSV
   ========================================= */
function parseCSV(text) {
    items = [];

    const lines = text.split("\n");

    // přeskočení hlavičky
    for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const [nazev, cena] = line.split(";");
        if (nazev && cena) {
            items.push({
                nazev: nazev.trim(),
                cena: parseFloat(cena.replace(",", ".")),
                mnozstvi: 0
            });
        }
    }
}

/* =========================================
   VYKRESLENÍ POLOŽEK
   ========================================= */
function renderItems() {
    const container = document.getElementById("items");
    container.innerHTML = "";

    items.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
        <span>${item.nazev} (${item.cena} Kč)</span>
        <input type="number" min="0" value="0"
        onchange="updateItem(${index}, this.value)">
        `;

        container.appendChild(div);
    });
}

/* =========================================
   AKTUALIZACE POČTU KUSŮ
   ========================================= */
function updateItem(index, value) {
    items[index].mnozstvi = parseInt(value) || 0;
    updateSummary();
}

/* =========================================
   PŘEPOČET CENY A POČTU
   ========================================= */
function updateSummary() {
    let celkem = 0;
    let pocet = 0;

    items.forEach(item => {
        celkem += item.cena * item.mnozstvi;
        pocet += item.mnozstvi;
    });

    document.getElementById("celkem").innerText =
        "Celková cena: " + celkem.toFixed(2) + " Kč";

    document.getElementById("pocet").innerText =
        "Počet kusů: " + pocet;
}

/* =========================================
   ODESLÁNÍ OBJEDNÁVKY EMAILEM
   ========================================= */
function odeslatObjednavku() {

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();

    // ✅ VALIDACE
    if (!name || !phone) {
        alert("Vyplňte prosím jméno i telefon.");
        return;
    }

    let celkem = 0;
    let pocet = 0;
    let text = "";

    items.forEach(item => {
        if (item.mnozstvi > 0) {
            let soucet = item.cena * item.mnozstvi;

            text += `${item.nazev} - ${item.mnozstvi} ks - ${item.cena} Kč = ${soucet} Kč\n`;

            celkem += soucet;
            pocet += item.mnozstvi;
        }
    });

    if (pocet === 0) {
        alert("Nevybral jsi žádné položky!");
        return;
    }

    text += `\nPočet kusů: ${pocet}`;
    text += `\nCelková cena: ${celkem} Kč`;

    /* =========================================
       MAILTO FUNKCE
       otevře e-mailového klienta
       ========================================= */
    const email = "vankova.julie@kostka-skola.cz";
    const subject = "Objednávka z bufetu";

    const body =
        `Objednávka od: ${name}\n` +
        `Telefon: ${phone}\n\n` +
        `Položky:\n${text}`;

    const mailtoLink =
        `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    window.location.href = mailtoLink;
}

/* =========================================
   START APLIKACE
   ========================================= */
loadCSV();

</script>

</body>
</html>
